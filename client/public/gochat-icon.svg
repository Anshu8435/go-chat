<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gochat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bubble-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#gochat-bg)" />

  <!-- Chat Bubble Icon -->
  <path
    d="M17 18h30c3.314 0 6 2.686 6 6v15c0 3.314-2.686 6-6 6H29l-9 7v-7h-3c-3.314 0-6-2.686-6-6V24c0-3.314 2.686-6 6-6z"
    fill="url(#bubble-shadow)"
    filter="url(#glow)"
  />

  <!-- Three Modern Conversation Dots -->
  <circle cx="26" cy="31.5" r="3" fill="#10b981" />
  <circle cx="34" cy="31.5" r="3" fill="#06b6d4" />
  <circle cx="42" cy="31.5" r="3" fill="#3b82f6" />

  <!-- Live Active Presence Status Dot -->
  <circle cx="52" cy="12" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
</svg>
